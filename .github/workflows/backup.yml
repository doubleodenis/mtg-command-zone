name: Nightly Database Backup

# Dumps the production database via the Supabase CLI and uploads it to S3.
# Retention (14 days) is enforced by an S3 lifecycle rule on the bucket,
# not by this workflow -- see repo docs / PR description for the exact rule.
#
# Uses `supabase db dump` rather than raw pg_dump: it runs pg_dump inside a
# Docker container from Supabase's own Postgres image, so it's always
# version-matched to the server (no manual apt/PGDG pinning), and it
# automatically excludes Supabase-managed schemas (auth, storage, extension
# schemas), which raw pg_dump would include and which don't restore cleanly
# into a target that doesn't already own them. Three separate invocations
# are required -- the default dump has no data or custom roles -- matching
# Supabase's own documented backup pattern.

on:
  schedule:
    - cron: '0 8 * * *' # 8am UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  backup:
    name: supabase db dump to S3
    runs-on: ubuntu-latest

    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database (roles, schema, data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # setup-cli points the CLI at ghcr.io, which rate-limits anonymous
          # pulls from shared GitHub Actions IPs -- `toomanyrequests` on the
          # pg_dump image, with nothing wrong on our side. Supabase mirrors
          # the same images to Docker Hub, a separate limit bucket.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: |
          mkdir -p dump
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/data.sql --use-copy --data-only

      - name: Archive dump
        run: |
          tar -czf backup.tar.gz -C dump roles.sql schema.sql data.sql

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload backup to S3
        run: |
          aws s3 cp backup.tar.gz \
            "s3://${{ secrets.S3_BACKUP_BUCKET }}/command-zone/backup-$(date -u +%Y-%m-%dT%H-%M-%SZ).tar.gz"
