name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    # Only run on PRs, not on push to main
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    # Only run on PRs, not on push to main
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* values are exposed to the browser bundle at runtime
          # anyway, so they're safe to store as plain repo secrets. Server
          # Components / clients aren't instantiated at build time, so the
          # build succeeds even if these resolve empty — set them for
          # realistic bundle output.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    # Only run on PRs, not on push to main
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      
      # This job only needs Postgres: `db reset` replays the migrations with
      # psql. Booting the whole local stack pulls ~10 extra images from
      # ghcr.io (studio, postgres-meta, realtime, storage, ...), which is both
      # slow and the source of intermittent `toomanyrequests` failures on a
      # registry we don't control. Exclude everything but the database.
      - name: Start Supabase locally (database only)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verify migrations apply cleanly
        run: supabase db reset

  deploy-migrations:
    name: Deploy Migrations to Production
    runs-on: ubuntu-latest
    environment: prod
    # Only run on push to main (after PR merge)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to production
        run: supabase db push --include-all --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}